org.gradle.jvmargs=-Xmx10240m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
# org.gradle.java.home removed; uses JDK from PATH (set in dev env)
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Serialize workers so the d8 fork's heap peak is bounded by a single classpath chunk.
org.gradle.workers.max=1
# Reduce project-wide gradle parallelism for the same reason.
org.gradle.parallel=false
